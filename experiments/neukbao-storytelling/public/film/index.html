<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KLMS-Sync-App 개발 이야기 — 필름</title>
  <link rel="stylesheet" href="film.css">
  <style>
    /* Player chrome. The film itself is drawn by film.js into #stage at a fixed
       1600x900 and scaled to fit, so the same renderer serves the browser and
       the offline frame grabber. */
    html, body { width: auto; height: auto; overflow: auto; }
    body.player { background: #0d0f0c; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 22px 18px 30px; min-height: 100vh; }
    body.capture { background: #fff; padding: 0; display: block; }
    body.capture #chrome, body.capture #intro { display: none; }
    #frame { position: relative; width: min(100%, 1600px); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; box-shadow: 0 24px 70px rgba(0,0,0,.5); background: var(--paper); }
    body.capture #frame { width: 1600px; height: 900px; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
    #stage { position: absolute; top: 0; left: 0; transform-origin: top left; }
    #intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: rgba(17,19,16,.9); color: #f1f3ed; z-index: 5; cursor: pointer; }
    #intro h1 { font-size: clamp(22px, 2.6vw, 40px); font-weight: 700; letter-spacing: -.02em; }
    #intro p { font-size: clamp(13px, 1.15vw, 18px); color: #b6bcb2; }
    #intro .play-ring { width: 84px; height: 84px; border-radius: 50%; border: 2px solid #f1f3ed; display: grid; place-items: center; font-size: 26px; padding-left: 6px; }
    #chrome { width: min(100%, 1600px); color: #e7eae4; font-family: var(--sans); display: flex; flex-direction: column; gap: 12px; }
    .bar { display: flex; align-items: center; gap: 14px; }
    .bar button { background: #1e221d; color: #e7eae4; border: 1px solid #3b423a; border-radius: 8px; min-height: 42px; padding: 0 16px; font: inherit; font-size: 15px; cursor: pointer; }
    .bar button:hover { background: #2a2f28; }
    .bar button:disabled { opacity: .45; cursor: default; }
    #seek { flex: 1; accent-color: #cfd6cb; height: 42px; }
    #clock { font-family: var(--mono); font-size: 14px; color: #a7ada3; min-width: 108px; text-align: right; font-variant-numeric: tabular-nums; }
    #chapters { display: flex; flex-wrap: wrap; gap: 7px; }
    #chapters button { background: #171a16; border: 1px solid #333930; color: #b6bcb2; border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; }
    #chapters button[aria-current="true"] { background: #e7eae4; color: #111310; border-color: #e7eae4; }
    .note { font-size: 12.5px; color: #7f867b; line-height: 1.6; }
    .note a { color: #b6bcb2; }
    @media (prefers-reduced-motion: reduce) { #frame { box-shadow: none; } }
  </style>
</head>
<body class="player">
  <div id="frame">
    <div id="stage"></div>
    <div id="intro" role="button" tabindex="0" aria-label="필름 재생">
      <div class="play-ring">▶</div>
      <h1>KLMS-Sync-App 개발 이야기</h1>
      <p>내레이션이 있는 3분 9초 필름. 화면은 story.json에서 실시간으로 그려진다.</p>
    </div>
  </div>

  <div id="chrome">
    <div class="bar">
      <button id="btn-play" type="button">▶ 재생</button>
      <button id="btn-back" type="button" title="10초 뒤로">« 10초</button>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="재생 위치">
      <span id="clock">0:00 / 0:00</span>
    </div>
    <div id="chapters"></div>
    <p class="note">
      이 페이지는 완성된 동영상을 트는 것이 아니라, <code>script.json</code>과 <code>../story.json</code>을 읽어
      매 프레임을 브라우저에서 직접 그린다. 소리는 <code>narration.mp3</code> 한 트랙이며 그 재생 시각이 화면의 기준이다.
      같은 렌더러로 오프라인에서 뽑은 파일은 <a href="../storytelling-film.mp4">storytelling-film.mp4</a>.
    </p>
  </div>

  <script src="film.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const capture = params.get("capture") === "1";
    if (capture) document.body.className = "capture";

    const frame = document.getElementById("frame");
    const stage = document.getElementById("stage");
    function fit() {
      if (capture) { stage.style.transform = "none"; return; }
      stage.style.transform = `scale(${frame.clientWidth / 1600})`;
    }
    addEventListener("resize", fit);

    window.filmReady = filmLoad().then((info) => {
      fit();
      filmRender(0);
      if (capture) return info;

      // The narration is decoded into a WebAudio buffer rather than driven through an
      // <audio> element: seeking an element needs HTTP Range support, which the plain
      // static servers used here do not provide. A decoded buffer seeks anywhere, and
      // AudioContext.currentTime gives a steadier clock than the element's.
      const audio = (() => {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();
        let buffer = null, source = null, playing = false, offset = 0, startedAt = 0, onended = null;
        const ready = fetch("narration.mp3")
          .then((r) => { if (!r.ok) throw new Error(`narration.mp3 ${r.status}`); return r.arrayBuffer(); })
          .then((b) => ctx.decodeAudioData(b))
          .then((b) => { buffer = b; return b; });
        const now = () => (playing ? Math.min(offset + (ctx.currentTime - startedAt), buffer ? buffer.duration : 0) : offset);
        const stopSource = () => { if (source) { source.onended = null; try { source.stop(); } catch {} source.disconnect(); source = null; } };
        return {
          ready,
          get paused() { return !playing; },
          get currentTime() { return now(); },
          set currentTime(t) {
            offset = Math.max(0, t);
            if (playing) { stopSource(); startAt(offset); }
          },
          set onended(fn) { onended = fn; },
          async play() {
            if (!buffer) await ready;
            if (ctx.state === "suspended") await ctx.resume();
            if (playing) return;
            if (offset >= buffer.duration - 0.05) offset = 0;
            startAt(offset);
          },
          pause() { if (!playing) return; offset = now(); playing = false; stopSource(); },
        };
        function startAt(t) {
          stopSource();
          source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          source.onended = () => { if (playing) { playing = false; offset = buffer.duration; if (onended) onended(); } };
          source.start(0, t);
          startedAt = ctx.currentTime;
          playing = true;
        }
      })();
      const intro = document.getElementById("intro");
      const btnPlay = document.getElementById("btn-play");
      const btnBack = document.getElementById("btn-back");
      const seek = document.getElementById("seek");
      const clock = document.getElementById("clock");
      const chapters = document.getElementById("chapters");

      const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
      const chapterBtns = info.scenes.map((s) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = s.id;
        b.onclick = () => { audio.currentTime = s.start + 0.02; paint(); };
        chapters.appendChild(b);
        return b;
      });

      let current = -1;
      function paint() {
        const t = Math.min(audio.currentTime, info.total);
        filmRender(t);
        seek.value = String(Math.round((t / info.total) * 1000));
        clock.textContent = `${fmt(t)} / ${fmt(info.total)}`;
        const idx = info.scenes.findLastIndex((s) => t >= s.start);
        if (idx !== current) {
          current = idx;
          chapterBtns.forEach((b, i) => b.setAttribute("aria-current", i === idx ? "true" : "false"));
        }
      }
      function loop() {
        paint();
        if (!audio.paused) requestAnimationFrame(loop);
      }
      function start() {
        intro.style.display = "none";
        btnPlay.disabled = true;
        btnPlay.textContent = "불러오는 중…";
        audio.play().then(() => { btnPlay.disabled = false; btnPlay.textContent = "⏸ 정지"; loop(); }).catch((err) => {
          btnPlay.disabled = false;
          btnPlay.textContent = "▶ 재생";
          intro.style.display = "flex";
          console.error(err);
        });
      }
      intro.onclick = start;
      intro.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); } };
      btnPlay.onclick = () => { if (audio.paused) start(); else { audio.pause(); btnPlay.textContent = "▶ 재생"; } };
      btnBack.onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 10); paint(); };
      seek.oninput = () => { audio.currentTime = (Number(seek.value) / 1000) * info.total; paint(); };
      audio.onended = () => { btnPlay.textContent = "▶ 재생"; paint(); };
      addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if (e.key === " ") { e.preventDefault(); btnPlay.click(); }
        else if (e.key === "ArrowLeft") { audio.currentTime = Math.max(0, audio.currentTime - 5); paint(); }
        else if (e.key === "ArrowRight") { audio.currentTime = Math.min(info.total, audio.currentTime + 5); paint(); }
      });
      clock.textContent = `0:00 / ${fmt(info.total)}`;
      return info;
    });
  </script>
</body>
</html>
