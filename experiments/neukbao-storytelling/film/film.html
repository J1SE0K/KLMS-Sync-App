<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>KLMS-Sync-App 개발 이야기 — film</title>
  <link rel="stylesheet" href="film.css">
</head>
<body>
  <div id="stage"></div>
  <script src="film.js"></script>
  <script>
    // Preview mode only. The frame grabber calls filmLoad()/filmRender(t) itself.
    window.filmReady = filmLoad().then((info) => {
      if (new URLSearchParams(location.search).get("preview") === "1") {
        const t0 = performance.now();
        const loop = () => {
          const t = (performance.now() - t0) / 1000;
          filmRender(Math.min(t, info.total));
          if (t < info.total) requestAnimationFrame(loop);
        };
        loop();
      } else {
        filmRender(0);
      }
      return info;
    });
  </script>
</body>
</html>
