name: Private UI readiness

on:
  workflow_dispatch:
    inputs:
      run_ios_devices:
        description: Run signed build and launch checks on connected iPhone and iPad devices
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 19 * * *"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: private-ui-readiness
  cancel-in-progress: false

jobs:
  private-mac-readiness:
    name: Private Mac and device readiness
    if: github.repository_visibility == 'private'
    runs-on: [self-hosted, macOS, klms-ui-readiness]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Run private UI readiness gate
        env:
          KLMS_READINESS_SWIFT_TESTS: "1"
          KLMS_READINESS_MAC: "1"
          KLMS_READINESS_ALLOW_DESTRUCTIVE_ACTIONS: "0"
          KLMS_READINESS_IOS_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ios_devices && '1' || '0' }}
          KLMS_READINESS_IOS_LAUNCH: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ios_devices && '1' || '0' }}
        run: |
          set +e
          tools/verify_klms_app_readiness.sh > ui-readiness.log 2>&1
          readiness_status=$?
          grep '^readiness-summary ' ui-readiness.log || printf '%s\n' 'readiness-summary status=fail summary=missing'
          rm -f ui-readiness.log
          exit "$readiness_status"
